/* ---- Campaign Map ---- */
.app { min-height: 720px; }
.strip { flex: none; display: flex; align-items: stretch; gap: 10px; padding: 10px 16px; background: var(--bg); min-width: 0; }
.funnel { display: flex; align-items: stretch; gap: 0; flex: 1; min-width: 0; overflow-x: auto; }
.stage { flex: 1 1 0; min-width: 118px; text-align: left; background: var(--surface); border: 1px solid var(--line); padding: 7px 10px 8px; cursor: pointer; position: relative; border-radius: 0; display: flex; flex-direction: column; gap: 2px; }
.stage:first-child { border-radius: 8px 0 0 8px; } .stage:last-child { border-radius: 0 8px 8px 0; } .stage + .stage { margin-left: -1px; }
.stage:hover { background: var(--surface-2); }
.stage[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); z-index: 1; background: var(--surface); }
.stage .lbl { font-size: 11px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stage .n { font-size: 20px; font-weight: 600; line-height: 1.1; letter-spacing: -.01em; }
.stage .drop { font-size: 11px; color: var(--ink-3); font-weight: 400; margin-left: 6px; }
.stage .bar { height: 4px; border-radius: 2px; background: var(--surface-3); margin-top: 4px; overflow: hidden; }
.stage .bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.stage .thr { font-size: 10.5px; color: var(--ink-3); overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow-wrap: anywhere; } /* the whole definition is in the stage's title */
.panel-h { flex-wrap: wrap; row-gap: 4px; } .panel-h .sub { flex: 1 1 5em; } /* the epitope header carries two segmented controls: they wrap under the title instead of leaving the panel */
.strip-r { display: flex; flex-direction: column; justify-content: center; gap: 6px; flex: none; font-size: 12px; color: var(--ink-2); }
.strip-r select { font-size: 12px; }
.grid { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(300px, 1.05fr) minmax(400px, 1.3fr) minmax(300px, 1fr); gap: 10px; padding: 0 16px 14px; }
.vbox { position: relative; flex: 1; min-height: 200px; background: var(--viewer-bg); border-top: 1px solid var(--line); }
.vbox canvas { position: absolute; inset: 0; }
.vbadge { position: absolute; left: 10px; top: 10px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; }
.vlegend { position: absolute; left: 10px; bottom: 8px; display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--ink-3); pointer-events: none; }
.ramp { width: 96px; height: 8px; border-radius: 4px; border: 1px solid var(--line); }
.vtools { position: absolute; right: 8px; top: 8px; display: flex; gap: 4px; }
.strip1d { flex: none; border-top: 1px solid var(--line); padding: 6px 10px 8px; position: relative; }
.strip1d canvas { width: 100%; height: 116px; cursor: crosshair; }
.strip1d .cap { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--ink-3); margin-bottom: 2px; gap: 8px; }
.mapwrap { position: relative; flex: 1; min-height: 240px; background: var(--viewer-bg); border-top: 1px solid var(--line); }
.mapwrap canvas { position: absolute; inset: 0; }
.legend { flex: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--line); }
.lg { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px 3px 6px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); cursor: pointer; font-size: 11.5px; color: var(--ink-2); white-space: nowrap; }
.lg:hover { border-color: var(--line-strong); color: var(--ink); }
.lg[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.lg svg { width: 12px; height: 12px; }
.lg .c { color: var(--ink-3); font-variant-numeric: tabular-nums; }
.hover-card { position: fixed; z-index: 60; pointer-events: none; width: 232px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: var(--shadow); padding: 8px; opacity: 0; transition: opacity .08s; }
.hover-card.on { opacity: 1; }
.hover-card canvas { width: 100%; height: 118px; background: var(--viewer-bg); border-radius: 6px; border: 1px solid var(--line); }
.hc-h { display: flex; align-items: center; gap: 6px; margin: 6px 0 4px; font-weight: 600; }
.hc-g { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px 8px; font-size: 11px; }
.hc-g span { color: var(--ink-3); display: block; font-size: 10px; letter-spacing: .04em; text-transform: uppercase; }
.hc-g b { font-weight: 600; font-variant-numeric: tabular-nums; }
.detail { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 12px; overflow: auto; min-height: 0; flex: 1; }
.dh { display: flex; align-items: center; gap: 8px; padding-top: 2px; }
.dh h3 { margin: 0; font-size: 15px; font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.stats > div { background: var(--surface); padding: 6px 8px; min-width: 0; }
.stats .k { font-size: 10px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }
.stats .v { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.sect { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; margin: 0 0 6px; display: flex; align-items: center; gap: 8px; }
.sect .grow { flex: 1; height: 1px; background: var(--line); }
.row { display: grid; grid-template-columns: 88px 1fr auto; gap: 8px; align-items: center; padding: 5px 4px; border-radius: 7px; cursor: pointer; border: 1px solid transparent; }
.row:hover, .row.on { background: var(--surface-2); border-color: var(--line); }
.row canvas { width: 88px; height: 60px; border-radius: 5px; background: var(--viewer-bg); border: 1px solid var(--line); }
.row .t1 { display: flex; align-items: center; gap: 6px; font-weight: 600; }
.row .t2 { font-size: 11px; color: var(--ink-3); display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
.minibar { display: inline-flex; align-items: center; gap: 4px; }
.minibar i { display: inline-block; width: 42px; height: 4px; background: var(--surface-3); border-radius: 2px; position: relative; overflow: hidden; }
.minibar i b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 2px; }
.star { border: 0; background: transparent; cursor: pointer; color: var(--ink-3); padding: 4px; border-radius: 6px; }
.star:hover { color: var(--ink); background: var(--surface-3); }
.star[aria-pressed="true"] { color: var(--hotspot); }
.star[aria-pressed="true"] .ic { fill: currentColor; }
.picks { display: flex; flex-wrap: wrap; gap: 5px; }
.pk { display: inline-flex; align-items: center; gap: 5px; padding: 2px 7px 2px 5px; border: 1px solid var(--line); border-radius: 6px; font-size: 11.5px; background: var(--surface); cursor: pointer; font-family: var(--font-mono); }
.pk:hover { border-color: var(--line-strong); background: var(--surface-2); }
.ctl { display: grid; grid-template-columns: 82px 1fr 34px; gap: 8px; align-items: center; font-size: 12px; color: var(--ink-2); }
.ctl output { font-variant-numeric: tabular-nums; text-align: right; color: var(--ink); font-weight: 500; }
.covbar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; background: var(--surface-3); }
.covbar i { display: block; height: 100%; }
.consensus { display: flex; flex-wrap: wrap; gap: 4px; }
.pbrow { display: grid; grid-template-columns: 112px 1fr 44px; gap: 8px; align-items: center; font-size: 11.5px; padding: 2px 0; }
.pbrow .b { position: relative; height: 8px; background: var(--surface-2); border-radius: 2px; } .pbrow .b i { position: absolute; top: 0; bottom: 0; left: 0; background: var(--m1); border-radius: 2px; } .pbrow .b i.s { background: color-mix(in srgb, var(--m1) 38%, transparent); border-radius: 0 2px 2px 0; }
.pbrow output { text-align: right; color: var(--ink-3); font-family: var(--font-mono); font-size: 11px; }
.stk { display: flex; height: 10px; gap: 2px; border-radius: 3px; overflow: hidden; } .stk i { display: block; min-width: 2px; }
.cres { font-family: var(--font-mono); font-size: 11px; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2); }
.cres.hot { border-color: var(--hotspot); color: var(--hotspot-ink); }
.note { font-size: 11.5px; color: var(--ink-3); line-height: 1.45; }
.tblw { position: absolute; inset: 0; overflow: auto; }
.tblw table tr { cursor: pointer; }
.tblw tr.on td { background: var(--accent-soft); }
.chipx { display: inline-flex; align-items: center; gap: 4px; padding: 2px 4px 2px 8px; border-radius: 99px; background: var(--accent-soft); border: 1px solid var(--accent); color: var(--ink); font-size: 11.5px; }
.chipx button { border: 0; background: transparent; cursor: pointer; color: var(--ink-2); display: inline-flex; padding: 1px; border-radius: 50%; }
.chipx button:hover { background: var(--surface-3); }
@media (max-width: 1100px) {
  .app { height: auto; } html, body { height: auto; }
  .grid { grid-template-columns: 1fr; } .panel { min-height: 420px; }
  .strip { flex-direction: column; } .strip-r { flex-direction: row; flex-wrap: wrap; align-items: center; }
  .hdr { flex-wrap: wrap; height: auto; padding-block: 8px; } .views { order: 5; }
}

.credit { flex: none; padding: 4px 16px 8px; font-size: 11px; color: var(--ink-3); } .credit a { color: var(--ink-2); }
.tag-real { font-size: 11px; color: var(--good-ink); border: 1px solid var(--good); background: var(--good-soft); padding: 2px 7px; border-radius: 99px; white-space: nowrap; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.lab { font-size: 12px; font-weight: 700; } .lab.y { color: var(--good-ink); } .lab.n { color: var(--bad-ink); }
.vbadge { right: 52px; } .vbadge .chip { white-space: normal; }
@media (max-width: 720px) { .tag-real { display: none; } }

/* per-run features and links (exported projects) */
a.mono, a.idlink { color: inherit; text-decoration: none; } a.mono:hover, a.idlink:hover { text-decoration: underline; }
.pkx { margin-left: 3px; color: var(--ink-3); text-decoration: none; } .pkx:hover { color: var(--ink); }
.chip.rm { background: repeating-linear-gradient(135deg, var(--surface-2) 0 4px, var(--line) 4px 5px); } /* opaque: the 3D view must not show through the label */
.strip-r .btn { align-self: flex-start; }
.row .t1 { flex-wrap: wrap; row-gap: 2px; }
@media (max-width: 720px) { .vbox { min-height: 300px; } }

<script>
const RAW = BS.data('campaign');
const HOM = BS.data('homolog');
(function () {
'use strict';
const C = Common.load(RAW), T = C.T, M3 = Mini3D, tip = C.tip(), SP = C.Spec(HOM), RUN = RAW.run || {};
const CAP = (f) => PF.cap(f), esc = BS.esc;
/* The runs of the project (campaign.runs[]) each carry their own hotspots and target construct. A bundle without runs[] (the mockup data) is one run
   and every per-run feature below stays off, so those pages read exactly as before. */
const RUNS = Array.isArray(RAW.runs) ? RAW.runs : [], PER_RUN = RUNS.length > 0, MULTI = RUNS.length > 1;
const HBR = PER_RUN && T.hotspots_by_run ? T.hotspots_by_run : null;
const ALL = C.designs, ACC = ALL.filter((d) => d.status !== 'rejected'), REJ = ALL.filter((d) => d.status === 'rejected');
SP.attach(ALL);
let D = ACC, DR = [];   // the designs in view (accepted, in the selected runs) and the rejected ones drawn on the map when asked for
const runTag = (id) => (/^run/i.test(id) ? 'r' + String(id).slice(3) : String(id));
const sid = (d) => {
  const m = d.id.match(/_s(\d+)_mpnn(\d+)$/); if (!m) return esc(d.id);
  return PER_RUN ? (MULTI ? esc(runTag(d.run)) + ' · ' : '') + 's' + m[1] + ' · m' + m[2] : 'seed ' + m[1] + ' · m' + m[2];
};
const idLink = (d, txt, cls, notitle) => '<a class="' + (cls || 'mono') + '" href="' + BS.link.design(d.id) + '"' + (notitle ? '' : ' title="' + esc(d.id) + '"') + '>' + txt + '</a>';
const num = (v, n) => (C.has(v) ? v.toFixed(n === undefined ? 2 : n) : '–');
const numU = (v, n, u) => (C.has(v) ? v.toFixed(n) + u : '–');

/* how close the designs in view come to the other subunit and to the rest of the protein (PER_RUN: exported projects) */
function ctxBlock(scope) {
  if (!PER_RUN || !(CAP('olig') || CAP('rest_ctx')) || !scope.length) return '';
  const row = (label, key, what) => { const v = scope.map((d) => d.m[key]).filter(C.has).sort((a, b) => a - b); return v.length ? '<div class="pbrow" title="' + esc('Distance from the closest binder atom to ' + what + ', over the ' + BS.plural(v.length, 'design') + ' in view') + '"><span>' + label + '</span><span class="muted" style="font-size:11.5px">median ' + v[v.length >> 1].toFixed(1) + ' Å · closest ' + v[0].toFixed(1) + ' Å</span></div>' : ''; };
  const rows = (CAP('olig') ? row(PF.t('map.ctx.partner_label', null, 'Other subunit'), 'olig_min', 'the other subunit') : '') + (CAP('rest_ctx') ? row(PF.t('map.ctx.rest_label', null, 'Rest of the protein'), 'rest_min', 'the rest of the protein (the part of the chain the construct leaves out)') : '');
  return rows ? '<div><div class="sect">Context<span class="grow"></span><span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">closest approach of the binder</span></div>' + rows + '</div>' : '';
}

/* ---------------- mode detail + picks ---------------- */
function drawDetail() {
  const el = $('#detail'); const scope = D.filter(inScope); const m = st.brush ? null : st.mode; const all = m ? D.filter((d) => d.mode === m) : D;
  const passN = scope.filter((d) => d.verdict !== 'fail').length, onEpi = scope.filter(epiOk).length;
  const tc = new Map(); scope.forEach((d) => d.tc.forEach((r) => tc.set(r, (tc.get(r) || 0) + 1))); const topRes = Array.from(tc).sort((a, b) => b[1] - a[1]).slice(0, 9);
  const covN = {}; MODES.forEach((mm) => (covN[mm] = pickList.filter((d) => d.mode === mm).length));
  const top = scope.slice().sort((a, b) => b.q - a.q).slice(0, 4);
  const title = st.brush ? 'Custom selection' : m ? m + ' · ' + MNAME[m] : 'All modes';
  const nmem = scope.filter((d) => d.m.mem_excess > 0).length, S = C.S;
  const cell = (k, v, title2) => '<div' + (title2 ? ' title="' + esc(title2) + '"' : '') + '><div class="k">' + k + '</div><div class="v">' + v + '</div></div>';
  const cells = [];
  if (CAP('families')) cells.push(cell('Backbones', new Set(scope.map((d) => d.bb)).size), cell('Folds', new Set(scope.map((d) => d.sc)).size)); else cells.push(cell('Classes', new Set(scope.map((d) => d.sc)).size));
  if (CAP('families') && CAP('membrane')) cells.push(cell('Membrane-side', nmem));
  if (CAP('complex_rmsd')) cells.push(cell('Pose flips', scope.filter((d) => d.flip).length));
  if (CAP('olig')) cells.push(cell('Clash', scope.filter((d) => d.m.olig_n3 >= S.partner.fail_n3).length, PF.t('map.stats.clash_title', { n3: S.partner.fail_n3 }, 'Designs with {n3} or more atoms within 3 Å of the other subunit')));
  if (CAP('flag_region')) cells.push(cell(PF.t('map.stats.flag_label', null, 'Flagged'), scope.filter((d) => d.m[PF.get('flag_region.key', 'flag') + '_n'] >= S.flagWarn).length));
  if (CAP('rest_ctx')) cells.push(cell(PF.t('map.stats.rest_label', null, 'Rest overlap'), scope.filter((d) => d.m.rest_n3 >= S.rest.fail_n3).length, PF.t('map.stats.rest_title', { n3: S.rest.fail_n3 }, 'Designs with {n3} or more atoms within 3 Å of the rest of the protein (the part of the chain the construct leaves out)')),
    cell(PF.t('map.stats.cut_label', null, 'Cut ends'), scope.filter((d) => d.m.cut_n >= S.cut.warn_n).length, PF.t('map.stats.cut_title', { k: S.cut.k, n: S.cut.warn_n }, 'Designs with {n} or more contacted residues within {k} residues of a cut end of the target')));
  if (PER_RUN) cells.push(cell('Wrong site', scope.filter(wrongSite).length, 'Designs that touch none of the hotspots of their own run'));
  if (CAP('rejected') && REJ.length && !st.brush) { const sel = BS.runFilter.selected(); cells.push(cell('Rejected', REJ.filter((d) => (!sel || sel.indexOf(d.run) >= 0) && (!m || d.mode === m)).length, 'Rejected designs whose footprint is nearest to ' + (m ? 'this mode' : 'a mode'))); }
  if (CAP('outcomes')) { const nb = scope.filter((d) => d.outcome.binds).length, w = scope.reduce((a, d) => a + wOf(d), 0), wb = scope.reduce((a, d) => a + (d.outcome.binds ? wOf(d) : 0), 0); cells.push(cell('Bound', st.reveal ? nb + '<span class="muted" style="font-size:11px;font-weight:400">/' + scope.length + '</span>' : '–', st.reveal ? (CAP('weights') ? 'Weighted to the full dataset: ' + (w ? (100 * wb / w).toFixed(1) : '0') + '%' : 'Share that bound: ' + (scope.length ? (100 * nb / scope.length).toFixed(1) : '0') + '%') : 'Hidden until you press Show lab results')); }
  const byRun = MULTI ? '<div class="note">By run: ' + selIds.map((id) => esc(id) + ' ' + scope.filter((d) => d.run === id).length).join(' · ') + '</div>' : '';
  el.innerHTML =
    '<div class="dh">' + (m ? shapeSvg(m, 14) : '') + '<h3>' + esc(title) + '</h3></div>' +
    '<div class="note">' + (m ? (MULTI && selIds.length < RUNS.length && RAW.modes[m] && RAW.modes[m].by_run ? '<span class="muted">All runs: </span>' : '') + esc(modeNote(m)) : st.brush ? 'Designs you selected on the map. The epitope map on the left now shows only these.' : 'Every design in the campaign, wherever it binds.') + '</div>' +
    '<div class="stats"><div><div class="k">In view</div><div class="v">' + scope.length + '<span class="muted" style="font-size:11px;font-weight:400">/' + all.length + '</span></div></div><div><div class="k">' + (PF.get('kind') === 'run' ? 'PASS or REVIEW' : 'Not NO PASS') + '</div><div class="v">' + passN + '</div></div><div><div class="k">Median ' + HEAD.label + '</div><div class="v">' + (scope.some((d) => C.has(headVal(d))) ? median(scope.map(headVal).filter((v) => C.has(v))).toFixed(2) : '–') + '</div></div><div><div class="k">On epitope</div><div class="v">' + onEpi + '</div></div>' +
    cells.join('') + '</div>' + byRun +
    '<div><div class="sect">Residues touched<span class="grow"></span><span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">share of designs in view</span></div><div class="consensus">' + (topRes.length ? topRes.map((r) => '<span class="cres' + (isHot(r[0]) ? ' hot' : '') + '" title="' + BS.plural(r[1], 'design') + '">' + T.resn[T.idx[r[0]]] + r[0] + ' <span class="muted">' + Math.round((100 * r[1]) / Math.max(1, scope.length)) + '%</span></span>').join('') : '<span class="note">No designs in view.</span>') + '</div></div>' +
    hotBlock(scope) + ctxBlock(scope) + specBlock(scope, topRes) + (CAP('outcomes') && st.reveal ? labModes(m) : '') +
    '<div><div class="sect">Best designs here<span class="grow"></span><span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">composite quality</span></div><div id="topList"></div></div>' +
    '<div><div class="sect">Quality–diversity picks<span class="grow"></span></div>' +
    '<div style="display:grid;gap:8px"><div class="ctl"><label for="kR">Budget</label><input type="range" id="kR" min="4" max="24" step="1" value="' + st.k + '"><output id="kO">' + st.k + '</output></div>' +
    '<div class="ctl"><label for="aR">Diversity</label><input type="range" id="aR" min="0" max="1" step="0.05" value="' + st.alpha + '"><output id="aO">' + st.alpha.toFixed(2) + '</output></div>' +
    '<div class="ctl" style="grid-template-columns:82px 1fr"><label for="poolS">Pool</label><select id="poolS"><option value="epi"' + (st.pool === 'epi' ? ' selected' : '') + '>' + PF.t('map.pool.epi', null, 'On the intended epitope') + ' (' + D.filter(STAGES[EPI].test).length + ')</option><option value="pose"' + (st.pool === 'pose' ? ' selected' : '') + '>' + PF.t('map.pool.pose', null, 'Any confident design that fits its surroundings') + ' (' + D.filter(STAGES[POSE].test).length + ')</option></select></div>' +
    '<div><div class="covbar" aria-label="Picks per binding mode">' + MODES.map((mm) => (covN[mm] ? '<i style="flex:' + covN[mm] + ';background:' + C.modeCss(mm) + '" title="' + mm + ': ' + covN[mm] + '"></i>' : '')).join('') + '</div>' +
    '<div class="note" style="margin-top:4px">' + (MODES.filter((mm) => covN[mm]).map((mm) => mm + ' × ' + covN[mm]).join(' · ') || 'no picks') + ' · ' + PF.t('map.picks.summary', { n_bb: new Set(pickList.map((d) => d.bb)).size, n_sc: new Set(pickList.map((d) => d.sc)).size, n_modes: new Set(pickList.map((d) => d.mode)).size }, '{n_bb} backbones · {n_sc} folds') + '</div></div>' +
    '<div class="picks" id="picksList"></div>' +
    '<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm" id="btnAdopt">' + icon('i-star') + 'Add picks to shortlist</button><button class="btn sm" id="btnStage">Show only picks</button><button class="btn sm ghost" id="btnFasta">' + icon('i-copy') + '<span>Copy FASTA</span></button></div>' +
    '<div class="note">Greedy selection maximises (1 − diversity) × quality + diversity × distance to everything already picked. Distance uses the target-residue footprint, and siblings on one backbone count as near-duplicates.</div></div></div>';
  const tl = $('#topList'); tl.innerHTML = '';
  top.forEach((d) => {
    const v = C.VERDICT[d.verdict], r = document.createElement('div'); r.className = 'row' + (d.id === st.focus ? ' on' : ''); const cv = document.createElement('canvas'); r.appendChild(cv);
    const mid = document.createElement('div'); mid.innerHTML = '<div class="t1">' + idLink(d, sid(d)) + '<span class="st ' + v.cls + '">' + icon(v.icon) + v.label + '</span>' + (CAP('outcomes') && st.reveal ? labPillM(d) : '') + flagsOf(d).map((f) => '<span title="' + esc(f[1]) + '" style="color:var(--warn-ink)">' + icon(f[0]) + '</span>').join('') + '</div><div class="t2"><span class="minibar"><span>' + HEAD.label + ' ' + num(headVal(d)) + '</span><i><b style="width:' + (C.has(headVal(d)) ? headVal(d) * 100 : 0) + '%"></b></i></span><span>' + (CAP('min_ipae') ? 'iPAE ' + num(d.m.min_ipae, 1) : CAP('ipsae') ? 'ipTM ' + num(d.m.iptm) : 'i_pAE ' + num(d.m.ipae_norm)) + '</span><span>' + d.hot.length + '/' + C.hotOf(d) + ' hotspots</span><span>' + esc(d.sc) + '</span></div>';
    r.appendChild(mid); const s = document.createElement('button'); s.className = 'star'; s.setAttribute('aria-label', 'Shortlist ' + d.id); s.setAttribute('aria-pressed', String(st.shortlist.has(d.id))); s.innerHTML = icon('i-star');
    s.onclick = (e) => { e.stopPropagation(); st.shortlist.has(d.id) ? st.shortlist.delete(d.id) : st.shortlist.add(d.id); update(true); }; r.appendChild(s);
    r.onclick = () => { st.focus = d.id; update(true); }; r.onpointerenter = () => { st.hover = d.id; if (st.view === 'map') drawMap(); updateViewer(); }; r.onpointerleave = () => { st.hover = null; if (st.view === 'map') drawMap(); updateViewer(); };
    const a = $('a', mid); if (a) a.onclick = (e) => e.stopPropagation();
    tl.appendChild(r); thumb(cv, d, 88, 60, true);
  });
  if (!top.length) tl.innerHTML = '<div class="note">Nothing in view here. Pick an earlier stage in the funnel, or another mode.</div>';
  const pl = $('#picksList'); pl.innerHTML = pickList.map((d) => '<span class="pk" data-id="' + esc(d.id) + '" tabindex="0">' + shapeSvg(d.mode, 10) + sid(d) + (PER_RUN ? '<a class="pkx" href="' + BS.link.design(d.id) + '" aria-label="Open ' + esc(d.id) + ' in the inspector" title="Open in the inspector">↗</a>' : '') + '</span>').join('');
  $$('.pk', pl).forEach((p) => p.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target === p) { e.preventDefault(); p.click(); } }));
  $$('.pk', pl).forEach((p) => (p.onclick = () => { const d = C.byId[p.dataset.id]; st.focus = d.id; st.mode = d.mode; st.brush = null; update(true); }));
  $$('.pkx', pl).forEach((a) => (a.onclick = (e) => e.stopPropagation()));
  const re = () => { computePicks(); update(true); };
  $('#kR').oninput = (e) => { st.k = +e.target.value; re(); }; $('#aR').oninput = (e) => { st.alpha = +e.target.value; re(); }; $('#poolS').onchange = (e) => { st.pool = e.target.value; re(); };
  $('#btnAdopt').onclick = () => { pickList.forEach((d) => st.shortlist.add(d.id)); update(true); };
  $('#btnStage').onclick = () => { st.stage = PI; update(true); };
  $('#btnFasta').onclick = () => { const txt = pickList.map((d) => '>' + d.id + ' mode=' + d.mode + ' ' + HEAD.label + '=' + num(headVal(d)) + '\n' + d.seq).join('\n'); const sp = $('#btnFasta span'); const done = (t) => { sp.textContent = t; setTimeout(() => (sp.textContent = 'Copy FASTA'), 1500); }; try { navigator.clipboard.writeText(txt).then(() => done('Copied'), () => done('Clipboard blocked')); } catch (e) { done('Clipboard blocked'); } };
  $('#shortN').textContent = st.shortlist.size;
}

/* ---------------- orchestration ---------------- */
const VIEWS = { map: 'closer = touches the same target residues', fp: 'one row per design, one column per target residue', hm: 'share of each mode’s designs that contact each target residue', tbl: 'the same marks as a ranked list' };
function setView(v) {
  if (v === 'hm' && !PER_RUN) v = 'map';
  st.view = v; $$('#viewSeg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
  $('#tblw').hidden = v !== 'tbl'; cvM.style.display = v === 'tbl' ? 'none' : 'block';
  $('#mapSub').textContent = VIEWS[v]; if (PER_RUN) $('#mapSub').title = VIEWS[v];
  hideCard(); tip.hide(); drawMain();
}
function drawMain() { if (st.view === 'map') drawMap(); else if (st.view === 'fp') drawFingerprints(); else if (st.view === 'hm') drawHeat(); else drawTable(); }
function update(keepPicks) {
  if (!keepPicks && !pickList.length) computePicks();
  drawCrumbs(); syncRej(); drawFunnel(); drawLegend(); updateViewer(); drawDetail(); drawMain();
}
$('#preset').onchange = (e) => { C.applyPreset(e.target.value); st.preset = e.target.value; computePicks(); update(true); };
addEventListener('resize', () => { drawStrip(); drawMain(); });
C.onTheme(() => { update(true); });
initPage();
$$('#viewSeg button').forEach((b) => (b.onclick = () => setView(b.dataset.v)));
refreshRuns(); setPool(); st.mode = MV[0] || null;
BS.runFilter.onChange(() => { refreshRuns(); setPool(); computePicks(); update(true); });
computePicks();
function applyHash() {   // map.html#m=<mode> opens a mode, #d=<design id> a design (the inspector links back with it), #fp, #tbl or #v=hm a view
  const hp = BS.link.parse(); if (hp.theme) return;
  if (hp.m && MV.indexOf(hp.m) >= 0) { st.mode = hp.m; st.focus = null; st.brush = null; }
  if (hp.d && C.byId[hp.d] && (D.concat(DR).indexOf(C.byId[hp.d]) >= 0)) { st.focus = hp.d; st.mode = C.byId[hp.d].mode; st.brush = null; }
  const hv = hp.v || ('fp' in hp ? 'fp' : 'tbl' in hp ? 'tbl' : ''); if (hv && VIEWS[hv] && (hv !== 'hm' || PER_RUN)) { st.view = hv; $$('#viewSeg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === hv))); $('#tblw').hidden = hv !== 'tbl'; cvM.style.display = hv === 'tbl' ? 'none' : 'block'; $('#mapSub').textContent = VIEWS[hv]; if (PER_RUN) $('#mapSub').title = VIEWS[hv]; }
}
applyHash(); BS.link.onChange(() => { applyHash(); update(true); });
/* keyboard (exported projects): modes, views, rejected switch, clear */
if (PER_RUN) document.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.defaultPrevented) return;
  const tg = e.target, tag = tg && tg.tagName; if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA' || (tg && tg.isContentEditable)) return;
  const k = e.key, pickMode = (m) => { if (!m) return; st.mode = st.mode === m ? null : m; st.focus = null; st.brush = null; update(); };
  if (/^[1-9]$/.test(k)) { pickMode(MV[Number(k) - 1]); e.preventDefault(); }
  else if (k === 'ArrowLeft' || k === 'ArrowRight') { if (tag === 'BUTTON' && tg.closest('.seg')) return; const i = MV.indexOf(st.mode), j = i < 0 ? (k === 'ArrowRight' ? 0 : MV.length - 1) : (i + (k === 'ArrowRight' ? 1 : -1) + MV.length) % MV.length; st.mode = MV[j]; st.focus = null; st.brush = null; update(); e.preventDefault(); }
  else if (k === 'Escape') { if (st.brush || st.range || st.focus) { st.brush = null; st.range = null; st.focus = null; update(); } }
  else if (/^[mfbt]$/i.test(k)) { const b = $('#viewSeg button[data-v="' + { m: 'map', f: 'fp', b: 'hm', t: 'tbl' }[k.toLowerCase()] + '"]'); if (b) b.click(); }
  else if (/^r$/i.test(k)) { const b = $('#btnRej'); if (b && !b.disabled) b.click(); }
});
window.__map = { st, update, setPool, get pts() { return mapPts.map((p) => ({ id: p.d && p.d.id, x: p.x, y: p.y, rej: !!p.rej })); }, get cvRect() { const r = cvM.getBoundingClientRect(); return { x: r.x, y: r.y, w: r.width, h: r.height }; }, get D() { return D; }, get DR() { return DR; }, STAGES, get MV() { return MV; }, get hotShown() { return hotShown; }, get remSt() { return remSt; }, get picks() { return pickList; } };
update(true);
$$('[data-nav]').forEach((a) => a.addEventListener('click', (e) => { if (a.getAttribute('href') === '#') e.preventDefault(); }));
})();
</script>
